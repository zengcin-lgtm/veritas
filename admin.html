<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veritas CMS | 後台管理總控中心</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 Quill Rich Text Editor (視覺化編輯器) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <style>
        body { background-color: #F3F4F6; font-family: sans-serif; }
        /* 讓 Quill 編輯器的高度變大且字體好看 */
        .ql-container { height: 400px; font-size: 16px; background-color: white; border-radius: 0 0 0.5rem 0.5rem; }
        .ql-toolbar { background-color: #F9FAFB; border-radius: 0.5rem 0.5rem 0 0; border-color: #D1D5DB; }
        .ql-editor p { margin-bottom: 1rem; line-height: 1.8; }
        
        /* 選單啟動狀態 */
        .nav-active { background-color: #8B0000; color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .nav-inactive { color: #4B5563; }
        .nav-inactive:hover { background-color: #E5E7EB; color: #1F2937; }
        
        /* 隱藏捲軸 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden antialiased">

    <!-- 側邊導覽列 (Sidebar) -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex shadow-sm z-20">
        <div class="h-20 flex items-center px-6 border-b border-gray-200 bg-gray-50 shrink-0">
            <h1 class="font-bold text-xl text-gray-800 tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-server text-red-800"></i> Veritas CMS
            </h1>
        </div>
        <div class="flex-1 overflow-y-auto py-6 px-4 space-y-2 no-scrollbar">
            
            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 px-2">內容發布</p>
            <button onclick="switchTab('tab-article', '發布新文章 (知識庫)')" id="btn-tab-article" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium nav-active transition">
                <i class="fa-solid fa-pen-nib w-5"></i> 發布新文章
            </button>
            <button onclick="switchTab('tab-news', '發布行政公告')" id="btn-tab-news" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium nav-inactive transition">
                <i class="fa-solid fa-bullhorn w-5"></i> 發布行政公告
            </button>
            <button onclick="switchTab('tab-link', '新增友站資源')" id="btn-tab-link" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium nav-inactive transition">
                <i class="fa-solid fa-link w-5"></i> 新增友站資源
            </button>
            
            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 px-2 mt-8">系統與表單管理</p>
            <button onclick="switchTab('tab-home', '首頁與募資設定'); loadHomeSettings();" id="btn-tab-home" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium nav-inactive transition">
                <i class="fa-solid fa-house-chimney w-5"></i> 首頁與募資設定
            </button>
            <button onclick="switchTab('tab-inbox', '系統收件匣 (表單與見證)'); loadInboxData();" id="btn-tab-inbox" class="w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium nav-inactive transition">
                <div class="flex items-center gap-3"><i class="fa-solid fa-inbox w-5"></i> 系統收件匣</div>
                <span class="bg-red-100 text-red-800 text-[10px] font-bold px-2 py-0.5 rounded-full">New</span>
            </button>

            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 px-2 mt-8">捷徑</p>
            <a href="index.html" target="_blank" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium nav-inactive transition">
                <i class="fa-solid fa-globe w-5"></i> 預覽前台網站
            </a>
            <!-- 可將井號替換為您的試算表網址 -->
            <a href="#" target="_blank" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium nav-inactive transition text-green-700 hover:bg-green-50">
                <i class="fa-solid fa-table w-5"></i> 開啟完整資料庫
            </a>
        </div>
    </aside>

    <!-- 主內容區塊 (Main Content) -->
    <main class="flex-1 flex flex-col overflow-hidden relative bg-gray-50">
        <!-- 頂部 Header -->
        <header class="h-20 bg-white border-b border-gray-200 flex items-center justify-between px-8 z-10 shrink-0">
            <h2 id="page-title" class="text-2xl font-bold text-gray-800">發布新文章 (知識庫)</h2>
            <div class="flex items-center gap-4">
                <span class="text-sm font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full border border-gray-200"><i class="fa-solid fa-circle text-green-500 text-[10px] mr-1"></i> API 連線正常</span>
                <div class="w-10 h-10 bg-red-800 rounded-full flex items-center justify-center text-white font-bold shadow-md">
                    Admin
                </div>
            </div>
        </header>

        <!-- 內容滑動區 -->
        <div class="flex-1 overflow-y-auto p-8 relative">
            <div class="max-w-5xl mx-auto">

                <!-- 全域載入遮罩 -->
                <div id="loading-overlay" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center rounded-2xl">
                    <i class="fa-solid fa-spinner fa-spin text-5xl text-red-800 mb-4"></i>
                    <p class="text-lg font-bold text-gray-700 tracking-widest" id="loading-text">資料處理中，請稍候...</p>
                </div>

                <!-- 模塊 1：發布文章 (知識庫) -->
                <div id="tab-article" class="tab-content block space-y-6">
                    <form id="form-article" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">文章標題 <span class="text-red-500">*</span></label>
                                <input type="text" name="title" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none" placeholder="請輸入標題">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">文章分類 <span class="text-red-500">*</span></label>
                                <select name="category" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none bg-white">
                                    <option value="theology">神學與教理</option>
                                    <option value="bible">聖經專欄</option>
                                    <option value="ethics">倫理與生活</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">作者 <span class="text-red-500">*</span></label>
                                <input type="text" name="author" required value="編輯部" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">發布日期 <span class="text-red-500">*</span></label>
                                <input type="date" name="date" id="article-date" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none">
                            </div>
                        </div>
                        <div class="mb-6">
                            <label class="block text-sm font-bold text-gray-700 mb-2">前台卡片簡介 (約 50 字) <span class="text-red-500">*</span></label>
                            <textarea name="desc" rows="2" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none resize-none" placeholder="這段文字會顯示在知識庫首頁的卡片上..."></textarea>
                        </div>
                        <div class="mb-6">
                            <label class="block text-sm font-bold text-gray-700 mb-2">封面縮圖網址 (選填)</label>
                            <input type="url" name="thumbnail" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none" placeholder="請貼上圖片的 URL">
                        </div>
                        <div class="mb-8">
                            <label class="block text-sm font-bold text-gray-700 mb-2">文章完整內容 <span class="text-red-500">*</span></label>
                            <div id="quill-editor"></div>
                            <input type="hidden" name="content" id="article-html-content">
                        </div>
                        <input type="hidden" name="action" value="addArticle">
                        <div class="flex justify-end border-t border-gray-100 pt-6">
                            <button type="submit" class="bg-red-800 text-white px-8 py-3 rounded-xl font-bold shadow-md hover:bg-red-900 transition flex items-center gap-2">
                                <i class="fa-solid fa-cloud-arrow-up"></i> 儲存並發布
                            </button>
                        </div>
                    </form>
                </div>

                <!-- 模塊 2：發布公告 -->
                <div id="tab-news" class="tab-content hidden space-y-6">
                    <form id="form-news" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">公告標題 <span class="text-red-500">*</span></label>
                                <input type="text" name="title" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">分類標籤 <span class="text-red-500">*</span></label>
                                <select name="category" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none bg-white">
                                    <option value="活動通知">活動通知</option>
                                    <option value="行政事務">行政事務</option>
                                    <option value="系統公告">系統公告</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">發布日期 <span class="text-red-500">*</span></label>
                                <input type="date" name="date" id="news-date" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">外部連結 (選填)</label>
                                <input type="url" name="link" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none" placeholder="網址">
                            </div>
                        </div>
                        <div class="mb-8">
                            <label class="block text-sm font-bold text-gray-700 mb-2">公告內文 <span class="text-red-500">*</span></label>
                            <textarea name="content" rows="4" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none resize-none"></textarea>
                        </div>
                        <input type="hidden" name="action" value="addNews">
                        <div class="flex justify-end border-t border-gray-100 pt-6">
                            <button type="submit" class="bg-gray-800 text-white px-8 py-3 rounded-xl font-bold shadow-md hover:bg-gray-900 transition flex items-center gap-2">
                                <i class="fa-solid fa-paper-plane"></i> 發布公告
                            </button>
                        </div>
                    </form>
                </div>

                <!-- 模塊 3：新增友站資源 -->
                <div id="tab-link" class="tab-content hidden space-y-6">
                    <form id="form-link" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">網站名稱 <span class="text-red-500">*</span></label>
                                <input type="text" name="title" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none" placeholder="例如：梵蒂岡新聞網">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">分類群組 <span class="text-red-500">*</span></label>
                                <input type="text" name="category" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none" placeholder="例如：普世教會">
                            </div>
                        </div>
                        <div class="mb-6">
                            <label class="block text-sm font-bold text-gray-700 mb-2">目標網址 URL <span class="text-red-500">*</span></label>
                            <input type="url" name="url" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none" placeholder="https://...">
                        </div>
                        <div class="mb-8">
                            <label class="block text-sm font-bold text-gray-700 mb-2">網站簡介</label>
                            <textarea name="desc" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none resize-none" placeholder="請簡述該網站的特色..."></textarea>
                        </div>
                        <input type="hidden" name="action" value="addLink">
                        <div class="flex justify-end border-t border-gray-100 pt-6">
                            <button type="submit" class="bg-blue-700 text-white px-8 py-3 rounded-xl font-bold shadow-md hover:bg-blue-800 transition flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i> 新增資源
                            </button>
                        </div>
                    </form>
                </div>

                <!-- 模塊 4：首頁與募資設定 -->
                <div id="tab-home" class="tab-content hidden space-y-6">
                    <form id="form-home" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-r-lg mb-8">
                            <h4 class="font-bold text-yellow-800 mb-1">即時同步說明</h4>
                            <p class="text-sm text-yellow-700">在此修改的數值，儲存後將立刻同步更新至前台首頁，不需經過試算表。</p>
                        </div>

                        <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2"><i class="fa-solid fa-bullhorn text-gray-400 mr-2"></i> 首頁置頂公告設定</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <div class="md:col-span-2">
                                <label class="block text-sm font-bold text-gray-700 mb-2">公告文字</label>
                                <input type="text" name="annText" id="input-annText" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none" placeholder="例如：2026 線上講座報名中...">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-bold text-gray-700 mb-2">「查看詳情」目標連結</label>
                                <input type="text" name="annLink" id="input-annLink" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none" placeholder="例如：news.html 或外部網址">
                            </div>
                        </div>

                        <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2"><i class="fa-solid fa-seedling text-gray-400 mr-2"></i> 募資進度設定</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">目前已募得金額 (填入純數字)</label>
                                <input type="number" name="fundRaised" id="input-fundRaised" class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none text-red-700 font-bold">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">年度目標金額 (填入純數字)</label>
                                <input type="number" name="fundTarget" id="input-fundTarget" class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none text-gray-600 font-bold">
                            </div>
                        </div>

                        <input type="hidden" name="action" value="updateHomeSettings">
                        <div class="flex justify-end border-t border-gray-100 pt-6">
                            <button type="submit" class="bg-gray-800 text-white px-8 py-3 rounded-xl font-bold shadow-md hover:bg-black transition flex items-center gap-2">
                                <i class="fa-solid fa-floppy-disk"></i> 儲存設定
                            </button>
                        </div>
                    </form>
                </div>

                <!-- 模塊 5：系統收件匣 (Dashboard) -->
                <div id="tab-inbox" class="tab-content hidden space-y-6">
                    <div class="flex justify-between items-end mb-4">
                        <div>
                            <h3 class="text-2xl font-bold text-gray-800">最新表單收件預覽</h3>
                            <p class="text-sm text-gray-500 mt-1">顯示各表單最新 10 筆資料。若需回覆或標記處理狀態，請前往試算表操作。</p>
                        </div>
                        <!-- 請將此處 # 換成您實際的 Google 試算表網址 -->
                        <a href="#" target="_blank" class="bg-green-100 text-green-700 hover:bg-green-200 px-4 py-2 rounded-lg font-bold text-sm transition flex items-center gap-2">
                            <i class="fa-solid fa-table"></i> 前往試算表處理
                        </a>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        <!-- 問答箱 -->
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-[500px]">
                            <div class="bg-blue-50 border-b border-blue-100 px-4 py-3 font-bold text-blue-800 flex justify-between items-center shrink-0">
                                <span><i class="fa-solid fa-clipboard-question mr-1"></i> 真理問答箱</span>
                                <span class="bg-white text-xs px-2 py-1 rounded-full text-blue-600">最新</span>
                            </div>
                            <div class="p-4 overflow-y-auto flex-1 space-y-4 bg-gray-50" id="inbox-qa">
                                <!-- JS 動態塞入 -->
                                <p class="text-center text-sm text-gray-400 mt-10">資料讀取中...</p>
                            </div>
                        </div>

                        <!-- 演講邀約 -->
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-[500px]">
                            <div class="bg-purple-50 border-b border-purple-100 px-4 py-3 font-bold text-purple-800 flex justify-between items-center shrink-0">
                                <span><i class="fa-solid fa-microphone-lines mr-1"></i> 演講邀約</span>
                            </div>
                            <div class="p-4 overflow-y-auto flex-1 space-y-4 bg-gray-50" id="inbox-invite">
                                <!-- JS 動態塞入 -->
                            </div>
                        </div>

                        <!-- 聯絡與見證 -->
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-[500px]">
                            <div class="bg-orange-50 border-b border-orange-100 px-4 py-3 font-bold text-orange-800 flex justify-between items-center shrink-0">
                                <span><i class="fa-solid fa-envelope-open-text mr-1"></i> 聯絡與見證</span>
                            </div>
                            <div class="p-4 overflow-y-auto flex-1 space-y-4 bg-gray-50" id="inbox-contact">
                                <!-- JS 動態塞入 -->
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // 1. 系統設定
        // ==========================================
        // ⚠️ 請填入您的 GAS API 網址！
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzbuprWzNPRRsz1Sxp4WtNJzrT-fgsQDc04vzF0RrEFK1WxpmUK4-zGdOpi9xdk9I_m/exec"; 

        // 自動填入今天的日期
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('article-date').value = today;
        document.getElementById('news-date').value = today;

        // ==========================================
        // 2. 側邊欄 Tab 切換邏輯
        // ==========================================
        function switchTab(tabId, titleText) {
            // 隱藏所有內容區塊
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            
            // 重置所有按鈕樣式
            const buttons = ['btn-tab-article', 'btn-tab-news', 'btn-tab-link', 'btn-tab-home', 'btn-tab-inbox'];
            buttons.forEach(id => {
                const btn = document.getElementById(id);
                if(btn) {
                    btn.classList.remove('nav-active');
                    btn.classList.add('nav-inactive');
                }
            });

            // 顯示目標內容與設定按鈕啟用樣式
            document.getElementById(tabId).classList.remove('hidden');
            const targetBtn = document.getElementById('btn-' + tabId);
            if(targetBtn) {
                targetBtn.classList.remove('nav-inactive');
                targetBtn.classList.add('nav-active');
            }
            
            // 更改 Header 標題
            document.getElementById('page-title').textContent = titleText;
        }

        // ==========================================
        // 3. 初始化 Quill 視覺化編輯器
        // ==========================================
        var quill = new Quill('#quill-editor', {
            theme: 'snow',
            placeholder: '在此撰寫您的專欄，支援粗體、標題、清單與直接貼上圖片...',
            modules: {
                toolbar: [
                    [{ 'header': [2, 3, false] }], 
                    ['bold', 'italic', 'underline', 'strike'], 
                    [{ 'color': [] }, { 'background': [] }],   
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }], 
                    ['blockquote', 'link', 'image', 'video'], 
                    ['clean'] 
                ]
            }
        });

        // ==========================================
        // 4. 共用表單送出機制 (串接 GAS POST)
        // ==========================================
        async function submitData(formElement, isArticle = false) {
            const overlay = document.getElementById('loading-overlay');
            document.getElementById('loading-text').textContent = '資料儲存中，請稍候...';
            overlay.classList.remove('hidden'); 

            if (isArticle) {
                const htmlContent = document.querySelector('#quill-editor .ql-editor').innerHTML;
                document.getElementById('article-html-content').value = htmlContent;
                if (quill.getText().trim().length === 0) {
                    alert("文章內容不能為空！");
                    overlay.classList.add('hidden');
                    return;
                }
            }

            const formData = new FormData(formElement);
            const data = new URLSearchParams();
            for (const pair of formData) {
                if(pair[0] === 'date') {
                    const d = new Date(pair[1]);
                    data.append('date', `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`);
                } else {
                    data.append(pair[0], pair[1]);
                }
            }

            try {
                const response = await fetch(GAS_API_URL, { method: 'POST', body: data });
                const result = await response.json();
                
                if (result.status === 'success') {
                    alert('✅ 儲存成功！資料已寫入資料庫。');
                    if (isArticle) quill.setContents([]); 
                    // 若不是首頁設定，才清空表單
                    if (formElement.id !== 'form-home') {
                        formElement.reset(); 
                        if(document.getElementById('article-date')) document.getElementById('article-date').value = today;
                        if(document.getElementById('news-date')) document.getElementById('news-date').value = today;
                    }
                } else {
                    throw new Error(result.message || '伺服器發生未知錯誤');
                }
            } catch (error) {
                console.error('執行失敗:', error);
                alert('❌ 抱歉，操作失敗。錯誤原因：' + error.message);
            } finally {
                overlay.classList.add('hidden');
            }
        }

        // 綁定各表單事件
        ['form-article', 'form-news', 'form-link', 'form-home'].forEach(id => {
            const form = document.getElementById(id);
            if(form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    submitData(e.target, id === 'form-article');
                });
            }
        });

        // ==========================================
        // 5. 非同步讀取資料 (首頁設定與收件匣)
        // ==========================================
        async function loadHomeSettings() {
            try {
                document.getElementById('loading-text').textContent = '讀取設定中...';
                document.getElementById('loading-overlay').classList.remove('hidden');
                
                const response = await fetch(`${GAS_API_URL}?action=getHomeData`);
                const data = await response.json();
                
                if(!data.error) {
                    document.getElementById('input-annText').value = data.announcement.text || '';
                    document.getElementById('input-annLink').value = data.announcement.link || '';
                    document.getElementById('input-fundRaised').value = data.funding.raised || 0;
                    document.getElementById('input-fundTarget').value = data.funding.target || 0;
                }
            } catch(e) {
                console.error(e);
            } finally {
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        }

        async function loadInboxData() {
            try {
                document.getElementById('loading-text').textContent = '同步收件匣中...';
                document.getElementById('loading-overlay').classList.remove('hidden');
                
                const response = await fetch(`${GAS_API_URL}?action=getInboxData`);
                const data = await response.json();
                
                if(!data.error) {
                    renderInboxCards('inbox-qa', data.qa, item => `
                        <div class="text-xs text-gray-400 mb-1">${formatDate(item.date)}</div>
                        <div class="font-bold text-sm text-gray-800">${item.name} <span class="bg-gray-200 text-gray-600 px-2 py-0.5 rounded text-[10px] ml-1">${item.category}</span></div>
                        <p class="text-sm text-gray-600 mt-1 line-clamp-3">${item.content}</p>
                    `);
                    
                    renderInboxCards('inbox-invite', data.invite, item => `
                        <div class="text-xs text-gray-400 mb-1">申請日: ${formatDate(item.date)}</div>
                        <div class="font-bold text-sm text-gray-800">${item.org}</div>
                        <p class="text-sm text-gray-600 mt-1"><i class="fa-regular fa-calendar text-gray-400"></i> ${item.eventDate}</p>
                        <p class="text-xs text-gray-500 mt-1">聯絡人: ${item.name}</p>
                    `);
                    
                    renderInboxCards('inbox-contact', data.contact, item => `
                        <div class="text-xs text-gray-400 mb-1">${formatDate(item.date)}</div>
                        <div class="font-bold text-sm text-gray-800">${item.name} <span class="bg-gray-200 text-gray-600 px-2 py-0.5 rounded text-[10px] ml-1">${item.category}</span></div>
                        <p class="text-sm text-gray-600 mt-1 line-clamp-3">${item.content}</p>
                    `);
                }
            } catch(e) {
                console.error(e);
            } finally {
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        }

        function renderInboxCards(containerId, dataArray, htmlGenerator) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if(dataArray.length === 0) {
                container.innerHTML = '<p class="text-center text-sm text-gray-400 mt-4">目前沒有資料</p>';
                return;
            }
            dataArray.forEach(item => {
                const isUnread = item.status === '未處理';
                const borderClass = isUnread ? 'border-l-4 border-l-red-500' : 'border-l-4 border-l-gray-300 opacity-60';
                
                const card = document.createElement('div');
                card.className = `bg-white p-3 rounded-lg shadow-sm border border-gray-100 ${borderClass}`;
                card.innerHTML = htmlGenerator(item);
                container.appendChild(card);
            });
        }
        
        function formatDate(dateStr) {
            try {
                const d = new Date(dateStr);
                return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
            } catch(e) { return dateStr; }
        }

    </script>
</body>
