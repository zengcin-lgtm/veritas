<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veritas CMS | 後台管理總控中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <style>
        body { background-color: #F3F4F6; font-family: sans-serif; }
        .ql-container { height: 400px; font-size: 16px; background-color: white; border-radius: 0 0 0.5rem 0.5rem; }
        .ql-toolbar { background-color: #F9FAFB; border-radius: 0.5rem 0.5rem 0 0; border-color: #D1D5DB; }
        .ql-editor p { margin-bottom: 1rem; line-height: 1.8; }
        
        .nav-active { background-color: #8B0000; color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .nav-inactive { color: #4B5563; }
        .nav-inactive:hover { background-color: #E5E7EB; color: #1F2937; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden antialiased">

    <!-- Toast 通知容器 -->
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex shadow-sm z-20 shrink-0">
        <div class="h-20 flex items-center px-6 border-b border-gray-200 bg-gray-50 shrink-0">
            <h1 class="font-bold text-xl text-gray-800 tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-server text-red-800"></i> Veritas CMS
            </h1>
        </div>
        <div class="flex-1 overflow-y-auto py-6 px-4 space-y-2 no-scrollbar">
            
            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 px-2">內容發布與管理</p>
            <button onclick="switchTab('tab-article', '文章管理 (知識庫)')" id="btn-tab-article" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium nav-active transition">
                <i class="fa-solid fa-book-open w-5"></i> 文章管理
            </button>
            <button onclick="switchTab('tab-category', '文章分類設定')" id="btn-tab-category" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium nav-inactive transition">
                <i class="fa-solid fa-tags w-5"></i> 文章分類設定
            </button>
            <button onclick="switchTab('tab-news', '行政公告管理')" id="btn-tab-news" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium nav-inactive transition">
                <i class="fa-solid fa-bullhorn w-5"></i> 公告管理
            </button>
            <button onclick="switchTab('tab-link', '新增友站資源')" id="btn-tab-link" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium nav-inactive transition">
                <i class="fa-solid fa-link w-5"></i> 新增友站資源
            </button>
            
            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 px-2 mt-8">系統與表單管理</p>
            <button onclick="switchTab('tab-home', '首頁與募資設定'); loadHomeSettings();" id="btn-tab-home" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium nav-inactive transition">
                <i class="fa-solid fa-house-chimney w-5"></i> 首頁與募資設定
            </button>
            <button onclick="switchTab('tab-inbox', '系統收件匣 (表單與見證)')" id="btn-tab-inbox" class="w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium nav-inactive transition">
                <div class="flex items-center gap-3"><i class="fa-solid fa-inbox w-5"></i> 系統收件匣</div>
            </button>

            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 px-2 mt-8">捷徑</p>
            <a href="index.html" target="_blank" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium nav-inactive transition">
                <i class="fa-solid fa-globe w-5"></i> 預覽前台網站
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden relative bg-gray-50">
        <!-- 頂部 Header -->
        <header class="h-20 bg-white border-b border-gray-200 flex items-center justify-between px-8 z-10 shrink-0">
            <h2 id="page-title" class="text-2xl font-bold text-gray-800">文章管理 (知識庫)</h2>
            <div class="flex items-center gap-4">
                <span class="text-sm font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full border border-gray-200"><i class="fa-solid fa-circle text-green-500 text-[10px] mr-1"></i> 連線正常</span>
                <button onclick="fetchAllData()" class="text-gray-500 hover:text-red-800 transition" title="重新整理資料"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </header>

        <!-- 內容滑動區 -->
        <div class="flex-1 overflow-y-auto p-8 relative">
            <div class="max-w-6xl mx-auto">

                <!-- 全域載入遮罩 -->
                <div id="loading-overlay" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center rounded-2xl">
                    <i class="fa-solid fa-spinner fa-spin text-5xl text-red-800 mb-4"></i>
                    <p class="text-lg font-bold text-gray-700 tracking-widest" id="loading-text">資料處理中，請稍候...</p>
                </div>

                <!-- 1. 文章管理 -->
                <div id="tab-article" class="tab-content block">
                    <div id="article-list-view" class="space-y-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold text-gray-800">已發布專欄文章</h3>
                            <button onclick="openArticleForm()" class="bg-red-800 text-white px-5 py-2 rounded-lg font-bold shadow-md hover:bg-red-900 transition flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i> 新增文章
                            </button>
                        </div>
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                            <table class="w-full text-left text-sm text-gray-600">
                                <thead class="bg-gray-50 text-gray-700 border-b border-gray-200">
                                    <tr>
                                        <th class="px-6 py-4 font-bold">發布日期</th>
                                        <th class="px-6 py-4 font-bold">分類</th>
                                        <th class="px-6 py-4 font-bold w-1/2">文章標題</th>
                                        <th class="px-6 py-4 font-bold text-right">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="article-table-body" class="divide-y divide-gray-100">
                                    <tr><td colspan="4" class="px-6 py-8 text-center text-gray-400">載入中...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div id="article-form-view" class="hidden space-y-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold text-gray-800" id="article-form-title">發布新文章</h3>
                            <button onclick="closeArticleForm()" class="text-gray-500 hover:text-gray-800 font-bold px-4 py-2 border border-gray-200 rounded-lg bg-white shadow-sm transition">返回列表</button>
                        </div>
                        <form id="form-article" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                            <input type="hidden" name="rowIndex" id="article-rowIndex" value="">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">文章標題 <span class="text-red-500">*</span></label>
                                    <input type="text" name="title" id="art-input-title" required class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">文章分類 <span class="text-red-500">*</span></label>
                                    <select name="category" id="art-input-category" required class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none bg-white">
                                        <!-- JS 動態載入自訂分類 -->
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">作者 <span class="text-red-500">*</span></label>
                                    <input type="text" name="author" id="art-input-author" required value="編輯部" class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">發布日期 <span class="text-red-500">*</span></label>
                                    <input type="date" name="date" id="art-input-date" required class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none">
                                </div>
                            </div>
                            <div class="mb-6">
                                <label class="block text-sm font-bold text-gray-700 mb-2">卡片簡介 (約 50 字) <span class="text-red-500">*</span></label>
                                <textarea name="desc" id="art-input-desc" rows="2" required class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none resize-none"></textarea>
                            </div>
                            <div class="mb-6">
                                <label class="block text-sm font-bold text-gray-700 mb-2">封面縮圖網址 (選填)</label>
                                <input type="url" name="thumbnail" id="art-input-thumbnail" class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none">
                            </div>
                            <div class="mb-8">
                                <label class="block text-sm font-bold text-gray-700 mb-2">文章完整內容 <span class="text-red-500">*</span></label>
                                <div id="quill-editor"></div>
                                <input type="hidden" name="content" id="article-html-content">
                            </div>
                            <div class="flex justify-end border-t border-gray-100 pt-6">
                                <button type="submit" class="bg-red-800 text-white px-8 py-3 rounded-xl font-bold shadow-md hover:bg-red-900 transition flex items-center gap-2">
                                    <i class="fa-solid fa-cloud-arrow-up"></i> 儲存文章
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 2. 動態分類管理 -->
                <div id="tab-category" class="tab-content hidden">
                    <div class="space-y-6">
                        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg mb-6">
                            <p class="text-sm text-blue-800 font-bold">在此新增的分類，會自動顯示在「發布文章」的選單，以及前台「護教知識庫」的分類標籤中。</p>
                        </div>
                        
                        <form id="form-category" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex items-end gap-4">
                            <div class="flex-1">
                                <label class="block text-sm font-bold text-gray-700 mb-2">新增分類名稱 <span class="text-red-500">*</span></label>
                                <input type="text" name="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none" placeholder="例如：靈修分享、教宗通諭...">
                            </div>
                            <input type="hidden" name="action" value="addCategory">
                            <button type="submit" class="bg-gray-800 text-white px-6 py-2 rounded-lg font-bold shadow-md hover:bg-black transition">
                                新增
                            </button>
                        </form>

                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                            <table class="w-full text-left text-sm text-gray-600">
                                <thead class="bg-gray-50 text-gray-700 border-b border-gray-200">
                                    <tr>
                                        <th class="px-6 py-4 font-bold">自訂分類名稱</th>
                                        <th class="px-6 py-4 font-bold text-right">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="category-table-body" class="divide-y divide-gray-100">
                                    <tr><td colspan="2" class="px-6 py-8 text-center text-gray-400">載入中...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 3. 公告管理 -->
                <div id="tab-news" class="tab-content hidden">
                    <div id="news-list-view" class="space-y-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold text-gray-800">已發布行政公告</h3>
                            <button onclick="openNewsForm()" class="bg-gray-800 text-white px-5 py-2 rounded-lg font-bold shadow-md transition"><i class="fa-solid fa-plus"></i> 新增公告</button>
                        </div>
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                            <table class="w-full text-left text-sm text-gray-600">
                                <thead class="bg-gray-50 text-gray-700 border-b border-gray-200">
                                    <tr>
                                        <th class="px-6 py-4 font-bold">發布日期</th>
                                        <th class="px-6 py-4 font-bold">分類</th>
                                        <th class="px-6 py-4 font-bold w-1/2">標題</th>
                                        <th class="px-6 py-4 font-bold text-right">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="news-table-body" class="divide-y divide-gray-100"></tbody>
                            </table>
                        </div>
                    </div>
                    <!-- 公告表單 -->
                    <div id="news-form-view" class="hidden space-y-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold text-gray-800" id="news-form-title">發布公告</h3>
                            <button onclick="closeNewsForm()" class="text-gray-500 border border-gray-200 px-4 py-2 rounded-lg bg-white">返回列表</button>
                        </div>
                        <form id="form-news" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                            <input type="hidden" name="rowIndex" id="news-rowIndex" value="">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                <div><label class="block text-sm font-bold mb-2">標題 <span class="text-red-500">*</span></label><input type="text" name="title" id="news-input-title" required class="w-full px-4 py-2 border rounded-lg"></div>
                                <div>
                                    <label class="block text-sm font-bold mb-2">分類 <span class="text-red-500">*</span></label>
                                    <select name="category" id="news-input-category" required class="w-full px-4 py-2 border rounded-lg bg-white">
                                        <option value="活動通知">活動通知</option><option value="行政事務">行政事務</option><option value="系統公告">系統公告</option>
                                    </select>
                                </div>
                                <div><label class="block text-sm font-bold mb-2">日期 <span class="text-red-500">*</span></label><input type="date" name="date" id="news-input-date" required class="w-full px-4 py-2 border rounded-lg"></div>
                                <div><label class="block text-sm font-bold mb-2">外部連結 (選填)</label><input type="url" name="link" id="news-input-link" class="w-full px-4 py-2 border rounded-lg"></div>
                            </div>
                            <div class="mb-8"><label class="block text-sm font-bold mb-2">公告內文 <span class="text-red-500">*</span></label><textarea name="content" id="news-input-content" rows="4" required class="w-full px-4 py-3 border rounded-lg resize-none"></textarea></div>
                            <div class="flex justify-end"><button type="submit" class="bg-gray-800 text-white px-8 py-3 rounded-xl font-bold">儲存公告</button></div>
                        </form>
                    </div>
                </div>

                <!-- 4. 友站資源 -->
                <div id="tab-link" class="tab-content hidden space-y-6">
                    <form id="form-link" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div><label class="block text-sm font-bold mb-2">網站名稱 <span class="text-red-500">*</span></label><input type="text" name="title" required class="w-full px-4 py-2 border rounded-lg"></div>
                            <div><label class="block text-sm font-bold mb-2">分類群組 <span class="text-red-500">*</span></label><input type="text" name="category" required class="w-full px-4 py-2 border rounded-lg"></div>
                        </div>
                        <div class="mb-6"><label class="block text-sm font-bold mb-2">目標 URL <span class="text-red-500">*</span></label><input type="url" name="url" required class="w-full px-4 py-2 border rounded-lg"></div>
                        <div class="mb-8"><label class="block text-sm font-bold mb-2">簡介</label><textarea name="desc" rows="2" class="w-full px-4 py-2 border rounded-lg resize-none"></textarea></div>
                        <input type="hidden" name="action" value="addLink">
                        <div class="flex justify-end"><button type="submit" class="bg-blue-700 text-white px-8 py-3 rounded-xl font-bold">新增資源</button></div>
                    </form>
                </div>

                <!-- 5. 首頁設定 -->
                <div id="tab-home" class="tab-content hidden space-y-6">
                    <form id="form-home" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-r-lg mb-8"><p class="text-sm text-yellow-700 font-bold">在此修改的數值，儲存後將立刻同步更新至前台首頁。</p></div>
                        <h3 class="text-lg font-bold mb-4 border-b pb-2"><i class="fa-solid fa-bullhorn text-gray-400 mr-2"></i> 首頁置頂公告</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <div class="md:col-span-2"><label class="block text-sm font-bold mb-2">公告文字</label><input type="text" name="annText" id="input-annText" class="w-full px-4 py-2 border rounded-lg"></div>
                            <div class="md:col-span-2"><label class="block text-sm font-bold mb-2">「查看詳情」連結</label><input type="text" name="annLink" id="input-annLink" class="w-full px-4 py-2 border rounded-lg"></div>
                        </div>
                        <h3 class="text-lg font-bold mb-4 border-b pb-2"><i class="fa-solid fa-seedling text-gray-400 mr-2"></i> 募資進度</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <div><label class="block text-sm font-bold mb-2">已募得金額</label><input type="number" name="fundRaised" id="input-fundRaised" class="w-full px-4 py-3 text-lg border rounded-lg text-red-700 font-bold"></div>
                            <div><label class="block text-sm font-bold mb-2">年度目標</label><input type="number" name="fundTarget" id="input-fundTarget" class="w-full px-4 py-3 text-lg border rounded-lg text-gray-600 font-bold"></div>
                        </div>
                        <input type="hidden" name="action" value="updateHomeSettings">
                        <div class="flex justify-end"><button type="submit" class="bg-gray-800 text-white px-8 py-3 rounded-xl font-bold">儲存設定</button></div>
                    </form>
                </div>

                <!-- 6. 系統收件匣 -->
                <div id="tab-inbox" class="tab-content hidden space-y-6">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col h-[600px]">
                            <div class="bg-blue-50 border-b border-blue-100 px-4 py-3 font-bold text-blue-800 shrink-0">真理問答箱</div>
                            <div class="p-4 overflow-y-auto flex-1 space-y-4 bg-gray-50" id="inbox-qa"></div>
                        </div>
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col h-[600px]">
                            <div class="bg-purple-50 border-b border-purple-100 px-4 py-3 font-bold text-purple-800 shrink-0">演講邀約</div>
                            <div class="p-4 overflow-y-auto flex-1 space-y-4 bg-gray-50" id="inbox-invite"></div>
                        </div>
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col h-[600px]">
                            <div class="bg-orange-50 border-b border-orange-100 px-4 py-3 font-bold text-orange-800 shrink-0">聯絡與見證</div>
                            <div class="p-4 overflow-y-auto flex-1 space-y-4 bg-gray-50" id="inbox-contact"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Modal 互動視窗 -->
    <div id="inbox-modal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 shrink-0">
                <h3 class="text-xl font-bold text-gray-800" id="modal-title">詳細內容</h3>
                <button onclick="closeModal('inbox-modal')" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 bg-white space-y-6" id="modal-content"></div>
            <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 shrink-0">
                <form id="modal-form" class="space-y-4">
                    <input type="hidden" id="modal-sheet-name"><input type="hidden" id="modal-row-index">
                    <div class="flex flex-wrap items-center gap-4 bg-white p-4 rounded-xl border border-gray-200">
                        <div class="flex-1 min-w-[200px]">
                            <label class="block text-xs font-bold text-gray-500 mb-1">處理狀態</label>
                            <select id="modal-input-status" class="w-full px-3 py-2 border rounded-lg font-bold">
                                <option value="未處理">未處理</option><option value="處理中">處理中</option><option value="已結案">已結案</option><option value="婉拒/無效">婉拒/無效</option>
                            </select>
                        </div>
                        <div id="modal-contact-controls" class="hidden flex-1 flex gap-4 min-w-[300px]">
                            <div class="flex-1">
                                <label class="block text-xs font-bold text-gray-500 mb-1">身份標籤</label>
                                <input type="text" id="modal-input-tag" class="w-full px-3 py-2 border rounded-lg">
                            </div>
                            <div class="flex flex-col justify-end">
                                <label class="flex items-center gap-2 cursor-pointer h-10 px-3 bg-red-50 border border-red-100 rounded-lg hover:bg-red-100">
                                    <input type="checkbox" id="modal-input-visible" class="w-4 h-4 text-red-600 rounded">
                                    <span class="text-sm font-bold text-red-800">顯示於首頁</span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 pt-2">
                        <button type="button" onclick="closeModal('inbox-modal')" class="px-5 py-2 rounded-lg font-bold text-gray-600 hover:bg-gray-200">取消</button>
                        <button type="button" onclick="submitModalUpdate()" class="bg-gray-800 text-white px-6 py-2 rounded-lg font-bold shadow-md hover:bg-black">儲存變更</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 設定與工具
        // ==========================================
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz6Iqnjt8r9poHA_l450uly_XkdX6d2iU7Qcc56fBObFbMoFrtXlSvFtznBUiRgO-lN/exec"; 
        let globalData = { articles: [], news: [], categories: [], inbox: { qa:[], invite:[], contact:[] } };
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('art-input-date').value = today;
        document.getElementById('news-input-date').value = today;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-green-600' : 'bg-red-600';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-triangle-exclamation';
            toast.className = `${bg} text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 translate-x-full opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-xl"></i><span class="font-bold text-sm tracking-wide">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-x-full', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-x-full', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function switchTab(tabId, title) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="btn-tab-"]').forEach(btn => { btn.classList.remove('nav-active'); btn.classList.add('nav-inactive'); });
            document.getElementById(tabId).classList.remove('hidden');
            const btn = document.getElementById('btn-' + tabId);
            if(btn) { btn.classList.remove('nav-inactive'); btn.classList.add('nav-active'); }
            document.getElementById('page-title').textContent = title;
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }

        // Quill 編輯器
        var quill = new Quill('#quill-editor', {
            theme: 'snow', placeholder: '撰寫專欄內容...',
            modules: { toolbar: [ [{ 'header': [2, 3, false] }], ['bold', 'italic', 'underline', 'strike'], [{ 'color': [] }, { 'background': [] }], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['blockquote', 'link', 'image'], ['clean'] ] }
        });

        // ==========================================
        // 2. 獲取資料
        // ==========================================
        async function fetchAllData() {
            const overlay = document.getElementById('loading-overlay');
            document.getElementById('loading-text').textContent = '資料同步中...';
            overlay.classList.remove('hidden');
            try {
                const [knowRes, catRes, newsRes, inboxRes] = await Promise.all([
                    fetch(`${GAS_API_URL}?action=getKnowledgeData`),
                    fetch(`${GAS_API_URL}?action=getArticleCategories`),
                    fetch(`${GAS_API_URL}?action=getNewsData`),
                    fetch(`${GAS_API_URL}?action=getInboxData`)
                ]);
                const knowData = await knowRes.json();
                const catData = await catRes.json();
                globalData.news = await newsRes.json();
                globalData.inbox = await inboxRes.json();
                
                // 處理舊資料英文標籤相容性
                knowData.forEach(item => {
                    if(item.category === 'bible') item.category = '聖經專欄';
                    if(item.category === 'theology') item.category = '神學與教理';
                    if(item.category === 'ethics') item.category = '倫理與生活';
                });
                globalData.articles = knowData.filter(item => item.type === 'article').reverse();
                globalData.categories = catData;

                renderCategorySelect();
                renderCategoryList();
                renderArticleList();
                renderNewsList();
                renderInboxLists();
                showToast('資料已成功同步。');
            } catch (e) { showToast('讀取失敗：' + e.message, 'error'); } 
            finally { overlay.classList.add('hidden'); }
        }
        window.onload = fetchAllData;

        // ==========================================
        // 3. 渲染邏輯
        // ==========================================
        
        // 渲染分類下拉選單
        function renderCategorySelect() {
            const sel = document.getElementById('art-input-category');
            sel.innerHTML = '';
            globalData.categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.name; opt.textContent = cat.name;
                sel.appendChild(opt);
            });
        }

        // 渲染分類管理列表
        function renderCategoryList() {
            const tbody = document.getElementById('category-table-body');
            tbody.innerHTML = '';
            globalData.categories.forEach(cat => {
                tbody.innerHTML += `
                    <tr class="border-b border-gray-50">
                        <td class="px-6 py-4 font-bold text-gray-800">${cat.name}</td>
                        <td class="px-6 py-4 text-right">
                            <button type="button" onclick="deleteRow('文章分類設定', ${cat.rowIndex})" class="text-red-500 hover:bg-red-50 px-3 py-1 rounded transition">刪除</button>
                        </td>
                    </tr>`;
            });
        }

        // 文章與公告列表
        function renderArticleList() {
            const tbody = document.getElementById('article-table-body');
            tbody.innerHTML = globalData.articles.map(item => `
                <tr class="hover:bg-gray-50 border-b border-gray-50">
                    <td class="px-6 py-4">${item.date}</td>
                    <td class="px-6 py-4"><span class="bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs">${item.category}</span></td>
                    <td class="px-6 py-4 font-bold text-gray-800">${item.title}</td>
                    <td class="px-6 py-4 text-right"><button onclick="editArticle(${item.rowIndex})" class="text-blue-600 hover:bg-blue-50 px-3 py-1 rounded">編輯</button></td>
                </tr>`).join('') || '<tr><td colspan="4" class="p-6 text-center">無資料</td></tr>';
        }

        function renderNewsList() {
            const tbody = document.getElementById('news-table-body');
            tbody.innerHTML = globalData.news.map(item => `
                <tr class="hover:bg-gray-50 border-b border-gray-50">
                    <td class="px-6 py-4">${item.date}</td>
                    <td class="px-6 py-4"><span class="bg-gray-100 px-2 py-1 rounded text-xs">${item.category}</span></td>
                    <td class="px-6 py-4 font-bold">${item.title}</td>
                    <td class="px-6 py-4 text-right"><button onclick="editNews(${item.rowIndex})" class="text-blue-600 hover:bg-blue-50 px-3 py-1 rounded">編輯</button></td>
                </tr>`).join('') || '<tr><td colspan="4" class="p-6 text-center">無資料</td></tr>';
        }

        // 表單開關與填寫
        function openArticleForm(isEdit = false) {
            document.getElementById('article-list-view').classList.add('hidden'); document.getElementById('article-form-view').classList.remove('hidden');
            if(!isEdit) { document.getElementById('form-article').reset(); quill.root.innerHTML = ''; document.getElementById('article-rowIndex').value = ''; }
        }
        function closeArticleForm() { document.getElementById('article-list-view').classList.remove('hidden'); document.getElementById('article-form-view').classList.add('hidden'); }
        
        function editArticle(rowIndex) {
            const article = globalData.articles.find(a => a.rowIndex === rowIndex);
            document.getElementById('article-rowIndex').value = article.rowIndex;
            document.getElementById('art-input-title').value = article.title;
            document.getElementById('art-input-category').value = article.category;
            document.getElementById('art-input-author').value = article.authorOrTime;
            try { let d = new Date(article.date.replace(/年|月/g, '-').replace(/日/g, '')); if(!isNaN(d)) document.getElementById('art-input-date').value = d.toISOString().split('T')[0]; } catch(e){}
            document.getElementById('art-input-desc').value = article.desc;
            document.getElementById('art-input-thumbnail').value = article.thumbnail;
            quill.root.innerHTML = article.content;
            document.getElementById('article-form-title').innerHTML = '<i class="fa-solid fa-pen text-blue-600 mr-2"></i> 編輯文章';
            openArticleForm(true);
        }

        function openNewsForm(isEdit = false) {
            document.getElementById('news-list-view').classList.add('hidden'); document.getElementById('news-form-view').classList.remove('hidden');
            if(!isEdit) { document.getElementById('form-news').reset(); document.getElementById('news-rowIndex').value = ''; }
        }
        function closeNewsForm() { document.getElementById('news-list-view').classList.remove('hidden'); document.getElementById('news-form-view').classList.add('hidden'); }
        
        function editNews(rowIndex) {
            const item = globalData.news.find(n => n.rowIndex === rowIndex);
            document.getElementById('news-rowIndex').value = item.rowIndex;
            document.getElementById('news-input-title').value = item.title; document.getElementById('news-input-category').value = item.category;
            document.getElementById('news-input-link').value = item.link === '#' ? '' : item.link; document.getElementById('news-input-content').value = item.content;
            try { let d = new Date(item.date); if(!isNaN(d)) document.getElementById('news-input-date').value = d.toISOString().split('T')[0]; } catch(e){}
            document.getElementById('news-form-title').innerHTML = '<i class="fa-solid fa-pen text-blue-600 mr-2"></i> 編輯公告';
            openNewsForm(true);
        }

        // ==========================================
        // 4. 收件匣管理
        // ==========================================
        function renderInboxLists() {
            const buildHTML = (item, idx, type, color, icon) => {
                const unread = item.status === '未處理';
                return `<div onclick="openInboxModal('${type}', ${idx})" class="p-3 rounded-lg border-l-4 cursor-pointer hover:shadow-md transition bg-white ${unread ? 'border-l-'+color+'-500' : 'border-l-gray-300 opacity-70'}">
                    <div class="flex justify-between mb-1"><span class="text-xs text-gray-400">${item.date.substring(0,10)}</span><span class="text-[10px] px-2 rounded ${unread?'bg-red-100 text-red-600':'bg-gray-200'}">${item.status}</span></div>
                    <div class="font-bold text-sm">${item.name || item.org} ${item.isVisible==='V'?'<i class="fa-solid fa-star text-yellow-500"></i>':''}</div>
                    <p class="text-xs text-gray-500 mt-1 line-clamp-2">${item.content || item.topic || ''}</p>
                </div>`;
            };
            document.getElementById('inbox-qa').innerHTML = globalData.inbox.qa.map((i, idx) => buildHTML(i, idx, 'qa', 'blue')).join('');
            document.getElementById('inbox-invite').innerHTML = globalData.inbox.invite.map((i, idx) => buildHTML(i, idx, 'invite', 'purple')).join('');
            document.getElementById('inbox-contact').innerHTML = globalData.inbox.contact.map((i, idx) => buildHTML(i, idx, 'contact', 'orange')).join('');
        }

        function openInboxModal(type, idx) {
            const item = globalData.inbox[type][idx];
            const sheets = { 'qa': '問答箱紀錄', 'invite': '演講邀約紀錄', 'contact': '聯絡表單紀錄' };
            document.getElementById('modal-sheet-name').value = sheets[type];
            document.getElementById('modal-row-index').value = item.rowIndex;
            document.getElementById('modal-input-status').value = item.status || '未處理';
            
            const ctrl = document.getElementById('modal-contact-controls');
            if(type === 'contact') {
                ctrl.classList.remove('hidden');
                document.getElementById('modal-input-visible').checked = (item.isVisible === 'V' || item.isVisible === 'v');
                document.getElementById('modal-input-tag').value = item.tag || '';
                document.getElementById('modal-content').innerHTML = `<div><b>姓名:</b> ${item.name}</div><div><b>分類:</b> ${item.category}</div><div><b>Email:</b> ${item.email}</div><div class="bg-gray-50 p-4 whitespace-pre-wrap">${item.content}</div>`;
            } else if(type === 'qa') {
                ctrl.classList.add('hidden');
                document.getElementById('modal-content').innerHTML = `<div><b>稱呼:</b> ${item.name}</div><div><b>分類:</b> ${item.category}</div><div class="bg-gray-50 p-4 whitespace-pre-wrap">${item.content}</div>`;
            } else {
                ctrl.classList.add('hidden');
                document.getElementById('modal-content').innerHTML = `<div><b>單位:</b> ${item.org}</div><div><b>日期:</b> ${item.eventDate}</div><div><b>聯絡人:</b> ${item.name} (${item.phone})</div><div class="bg-gray-50 p-4 whitespace-pre-wrap">${item.topic}</div>`;
            }
            openModal('inbox-modal');
        }

        async function submitModalUpdate() {
            const sheet = document.getElementById('modal-sheet-name').value;
            let updates = { 
                [sheet==='演講邀約紀錄'?'11':'6']: document.getElementById('modal-input-status').value 
            };
            if (sheet === '聯絡表單紀錄') {
                updates['7'] = document.getElementById('modal-input-visible').checked ? 'V' : '';
                updates['8'] = document.getElementById('modal-input-tag').value;
            }
            await executeAction('updateRow', { sheetName: sheet, rowIndex: document.getElementById('modal-row-index').value, updates: JSON.stringify(updates) });
            closeModal('inbox-modal'); fetchAllData();
        }

        // ==========================================
        // 5. 核心 API 互動 (刪除/更新/新增)
        // ==========================================
        async function executeAction(actionName, paramsObj) {
            document.getElementById('loading-overlay').classList.remove('hidden');
            const data = new URLSearchParams(); data.append('action', actionName);
            for(let key in paramsObj) data.append(key, paramsObj[key]);
            try {
                const res = await fetch(GAS_API_URL, { method: 'POST', body: data });
                const json = await res.json();
                if(json.status !== 'success') throw new Error(json.message);
                showToast('操作成功！'); return true;
            } catch(e) { showToast('錯誤: ' + e.message, 'error'); return false; }
            finally { document.getElementById('loading-overlay').classList.add('hidden'); }
        }

        async function deleteRow(sheetName, rowIndex) {
            if(confirm('確定要刪除這筆資料嗎？')) {
                if(await executeAction('deleteRow', { sheetName, rowIndex })) fetchAllData();
            }
        }

        async function submitForm(e, isArticle = false, isNews = false) {
            e.preventDefault();
            if(isArticle) document.getElementById('article-html-content').value = document.querySelector('#quill-editor .ql-editor').innerHTML;
            
            const formData = new FormData(e.target);
            const rowIndex = formData.get('rowIndex');
            const action = e.target.querySelector('[name="action"]')?.value;

            // 判斷是「更新」還是「新增」
            if(rowIndex) {
                let updates = {};
                let formattedDate = formData.get('date') ? new Date(formData.get('date')).toLocaleDateString('zh-TW', {year:'numeric',month:'long',day:'numeric'}) : '';
                if(isArticle) updates = { 1: formData.get('category'), 2: formData.get('title'), 3: formattedDate, 4: formData.get('desc'), 6: formData.get('author'), 7: formData.get('thumbnail'), 9: document.getElementById('article-html-content').value };
                if(isNews) updates = { 1: formattedDate, 2: formData.get('category'), 3: formData.get('title'), 4: formData.get('content'), 5: formData.get('link') || '#' };
                
                if(await executeAction('updateRow', { sheetName: isArticle ? '知識庫資料' : '行政公告', rowIndex, updates: JSON.stringify(updates) })) {
                    if(isArticle) closeArticleForm(); if(isNews) closeNewsForm(); fetchAllData();
                }
            } else {
                let params = {}; for(let p of formData) params[p[0]] = p[1];
                if(params.date) params.date = new Date(params.date).toLocaleDateString('zh-TW', {year:'numeric',month:'long',day:'numeric'});
                
                if(await executeAction(action || (isArticle ? 'addArticle' : (isNews ? 'addNews' : '')), params)) {
                    e.target.reset(); if(isArticle) { quill.setContents([]); closeArticleForm(); } if(isNews) closeNewsForm(); fetchAllData();
                }
            }
        }

        document.getElementById('form-article').addEventListener('submit', e => submitForm(e, true, false));
        document.getElementById('form-news').addEventListener('submit', e => submitForm(e, false, true));
        document.getElementById('form-category').addEventListener('submit', e => submitForm(e));
        document.getElementById('form-link').addEventListener('submit', e => submitForm(e));
        document.getElementById('form-home').addEventListener('submit', e => submitForm(e));

        async function loadHomeSettings() {
            try {
                const res = await fetch(`${GAS_API_URL}?action=getHomeData`); const data = await res.json();
                document.getElementById('input-annText').value = data.announcement?.text || ''; document.getElementById('input-annLink').value = data.announcement?.link !== '#'? data.announcement.link : '';
                document.getElementById('input-fundRaised').value = data.funding?.raised || 0; document.getElementById('input-fundTarget').value = data.funding?.target || 0;
            } catch(e) {}
        }
    </script>
</body>
</html>
