<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>護教專欄 | 天主教 Veritas 護教中心</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { veritas: { red: '#8B0000', darkred: '#5C0000', gold: '#D4AF37', light: '#FAFAFA', dark: '#2D3748' } }, fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] } }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #FAFAFA; }
        html { scroll-behavior: smooth; }
        .article-content h2 { font-size: 1.5rem; font-weight: bold; margin-top: 2rem; margin-bottom: 1rem; color: #2D3748; border-left: 4px solid #8B0000; padding-left: 0.5rem; }
        .article-content h3 { font-size: 1.25rem; font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #4A5568; }
        .article-content p { margin-bottom: 1.5rem; line-height: 1.8; color: #4A5568; font-size: 1.125rem; }
        .article-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1.5rem; color: #4A5568; line-height: 1.8; }
        .article-content a { color: #8B0000; text-decoration: underline; font-weight: 500; }
        .article-content blockquote { border-left: 4px solid #D4AF37; background-color: #FFFBEB; padding: 1rem 1.5rem; margin: 1.5rem 0; font-style: italic; color: #718096; }
        .article-content img { max-width: 100%; border-radius: 0.5rem; margin: 2rem 0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="text-veritas-dark antialiased">
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/zh_TW/sdk.js#xfbml=1&version=v17.0" nonce="abc1234"></script>

    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20">
                <div class="flex items-center">
                    <a href="index.html" class="flex items-center gap-3">
                        <img src="images/logo.png" alt="Logo" class="w-10 h-10 object-contain">
                        <div><h1 class="font-bold text-xl text-veritas-red tracking-wider">Veritas 護教中心</h1><p class="text-xs text-gray-500 font-medium">天主教數位弘道平台</p></div>
                    </a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="knowledge.html" class="text-veritas-red font-bold transition border-b-2 border-veritas-red pb-1">返回知識庫</a>
                </div>
            </div>
        </div>
    </nav>

    <div id="loading-screen" class="fixed inset-0 bg-veritas-light z-40 flex flex-col items-center justify-center pt-20">
        <i class="fa-solid fa-spinner fa-spin text-5xl text-veritas-gold mb-4"></i>
        <p class="font-bold text-gray-600">正在為您載入文章...</p>
    </div>

    <!-- 內容 -->
    <main id="article-main" class="py-12 bg-veritas-light hidden">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <nav class="text-sm font-medium text-gray-500 mb-8 flex items-center gap-2">
                <a href="index.html" class="hover:text-veritas-red transition"><i class="fa-solid fa-house"></i> 首頁</a> <i class="fa-solid fa-angle-right text-xs mx-1 text-gray-300"></i>
                <a href="knowledge.html" class="hover:text-veritas-red transition">護教知識庫</a> <i class="fa-solid fa-angle-right text-xs mx-1 text-gray-300"></i>
                <span id="breadcrumb-title" class="text-veritas-dark truncate max-w-[200px] inline-block">載入中</span>
            </nav>

            <header class="mb-10 border-b border-gray-200 pb-8 text-center sm:text-left">
                <div id="art-category" class="inline-block bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full mb-4 shadow-sm">專欄文章</div>
                <h1 id="art-title" class="text-3xl md:text-5xl font-black text-veritas-dark mb-6 leading-tight">載入中...</h1>
                
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 text-gray-500 text-sm">
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-600"><i class="fa-solid fa-user"></i></div><span id="art-author" class="font-bold text-gray-700">編輯部</span></div>
                        <span class="text-gray-300">|</span> <span id="art-date">YYYY/MM/DD</span>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="shareArticle('line')" class="w-9 h-9 rounded-full bg-[#06C755] text-white hover:opacity-80 transition flex items-center justify-center shadow-md"><i class="fa-brands fa-line text-lg"></i></button>
                        <button onclick="shareArticle('fb')" class="w-9 h-9 rounded-full bg-[#1877F2] text-white hover:opacity-80 transition flex items-center justify-center shadow-md"><i class="fa-brands fa-facebook-f text-lg"></i></button>
                        <button onclick="shareArticle('copy')" class="w-9 h-9 rounded-full bg-gray-600 text-white hover:bg-gray-800 transition flex items-center justify-center shadow-md"><i class="fa-solid fa-link"></i></button>
                    </div>
                </div>
            </header>

            <div id="art-hero-container" class="mb-12 rounded-2xl overflow-hidden shadow-lg hidden">
                <img id="art-hero-img" src="" alt="文章首圖" class="w-full h-auto object-cover max-h-[500px]">
            </div>

            <article id="art-content" class="article-content bg-white p-8 md:p-12 rounded-3xl shadow-sm border border-gray-100"></article>

            <div class="mt-12 flex justify-between items-center border-t border-gray-200 pt-8">
                <a href="knowledge.html" class="text-veritas-red font-bold hover:bg-red-50 px-6 py-2 rounded-full transition border border-veritas-red inline-flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> 返回知識庫</a>
            </div>

            <!-- FB 留言板 -->
            <div class="mt-16 bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                <h3 class="text-xl font-bold text-veritas-dark mb-6 flex items-center gap-2"><i class="fa-regular fa-comments text-blue-600"></i> 教友討論區</h3>
                <div id="fb-comments-container" class="w-full overflow-x-auto"></div>
            </div>
        </div>
    </main>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz6Iqnjt8r9poHA_l450uly_XkdX6d2iU7Qcc56fBObFbMoFrtXlSvFtznBUiRgO-lN/exec"; 

        const colorClasses = ['bg-blue-100 text-blue-800', 'bg-green-100 text-green-800', 'bg-orange-100 text-orange-800', 'bg-teal-100 text-teal-800', 'bg-indigo-100 text-indigo-800', 'bg-pink-100 text-pink-800'];
        function getCategoryColor(catName) {
            let hash = 0; for(let i=0; i<catName.length; i++) hash += catName.charCodeAt(i);
            return colorClasses[hash % colorClasses.length];
        }

        document.addEventListener('DOMContentLoaded', () => {
            const articleId = new URLSearchParams(window.location.search).get('id');
            if (!articleId) { showError("找不到指定的文章。"); return; }
            fetchArticleData(articleId);
        });

        async function fetchArticleData(targetTitle) {
            try {
                const response = await fetch(`${GAS_API_URL}?action=getKnowledgeData`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                // 處理舊版標籤
                data.forEach(item => {
                    if(item.category === 'bible') item.category = '聖經專欄';
                    if(item.category === 'theology') item.category = '神學與教理';
                    if(item.category === 'ethics') item.category = '倫理與生活';
                });

                const article = data.find(item => item.title === targetTitle);
                if (article) renderArticle(article); else showError("文章已被移除或不存在。");
            } catch (error) { showError("系統連線異常 (" + error.message + ")"); }
        }

        function renderArticle(art) {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('article-main').classList.remove('hidden');
            document.title = `${art.title} | Veritas 護教知識庫`;

            document.getElementById('breadcrumb-title').textContent = art.title;
            document.getElementById('art-title').textContent = art.title;
            document.getElementById('art-date').innerHTML = `<i class="fa-regular fa-calendar mr-1"></i> ${art.date}`;
            document.getElementById('art-author').textContent = art.authorOrTime || '編輯部';
            document.getElementById('art-content').innerHTML = art.content || art.desc;

            // 動態分類標籤與顏色
            const catBadge = document.getElementById('art-category');
            catBadge.textContent = art.category;
            catBadge.className = `inline-block text-xs font-bold px-3 py-1 rounded-full mb-4 shadow-sm ${getCategoryColor(art.category)}`;

            if (art.thumbnail) {
                document.getElementById('art-hero-img').src = art.thumbnail;
                document.getElementById('art-hero-container').classList.remove('hidden');
            }

            const currentUrl = window.location.href;
            const fbUrl = (currentUrl.includes('file://') || currentUrl.includes('localhost') || currentUrl.includes('127.0.0.1')) ? 'https://www.foday.idv.tw/' : currentUrl;
            const fbContainer = document.getElementById('fb-comments-container');
            fbContainer.innerHTML = `<div class="fb-comments" data-href="${fbUrl}" data-width="100%" data-numposts="5"></div>`;
            if (typeof FB !== 'undefined') FB.XFBML.parse(fbContainer); else setTimeout(() => { if (typeof FB !== 'undefined') FB.XFBML.parse(fbContainer); }, 1500);
        }

        function showError(msg) {
            document.getElementById('loading-screen').innerHTML = `<i class="fa-solid fa-circle-exclamation text-5xl text-red-500 mb-4"></i><p class="font-bold text-gray-700 text-xl mb-4">${msg}</p><a href="knowledge.html" class="bg-veritas-red text-white px-6 py-2 rounded-full font-bold">返回知識庫</a>`;
        }

        function shareArticle(platform) {
            const url = encodeURIComponent(window.location.href), title = encodeURIComponent(document.title);
            if (platform === 'line') window.open(`https://social-plugins.line.me/lineit/share?url=${url}`);
            else if (platform === 'fb') window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`);
            else if (navigator.share) navigator.share({ title: document.title, url: window.location.href });
        }
    </script>
</body>
</html>
