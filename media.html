<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影音策展 | 天主教 Veritas 護教中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        veritas: {
                            red: '#8B0000', darkred: '#5C0000', gold: '#D4AF37', light: '#FAFAFA', dark: '#2D3748'
                        }
                    },
                    fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0F172A; /* 影音頁面改用深色背景營造劇院感 */ }
        html { scroll-behavior: smooth; }
        .hero-gradient {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.4) 0%, rgba(15, 23, 42, 1) 100%), url('https://images.unsplash.com/photo-1611162617474-5b21e879e113?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
        }
        .hover-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .hover-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="text-gray-200 antialiased"> <!-- 改為淺色文字 -->

    <!-- 頂部導覽列 Navbar (深色模式) -->
    <nav class="bg-slate-900 shadow-md sticky top-0 z-50 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20">
                <div class="flex items-center">
                    <a href="index.html" class="flex items-center gap-3">
                        <img src="images/logo.png" alt="Veritas 護教中心 Logo" class="w-10 h-10 object-contain drop-shadow-md">
                        <div>
                            <h1 class="font-bold text-xl text-white tracking-wider">Veritas 護教中心</h1>
                            <p class="text-xs text-gray-400 font-medium">天主教數位弘道平台</p>
                        </div>
                    </a>
                </div>
                <!-- 電腦版選單 -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="about.html" class="text-gray-300 hover:text-white font-medium transition">關於我們</a>
                    <a href="knowledge.html" class="text-gray-300 hover:text-white font-medium transition">護教知識庫</a>
                    <a href="media.html" class="text-veritas-gold font-bold transition border-b-2 border-veritas-gold pb-1">影音策展</a>
                    <a href="qa.html" class="text-gray-300 hover:text-white font-medium transition">真理問答箱</a>
                    <a href="support.html" class="bg-veritas-red text-white px-5 py-2 rounded-full font-bold hover:bg-veritas-darkred transition shadow-md">
                        <i class="fa-solid fa-heart mr-2"></i>支持我們
                    </a>
                </div>
                <!-- 手機版選單按鈕 -->
                <div class="flex items-center md:hidden">
                    <button id="mobile-menu-btn" class="text-gray-300 hover:text-white focus:outline-none">
                        <i class="fa-solid fa-bars text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 手機版下拉選單 (深色) -->
    <div id="mobile-menu" class="hidden md:hidden bg-slate-800 border-t border-slate-700 shadow-xl absolute w-full z-40">
        <div class="px-4 pt-2 pb-6 space-y-2">
            <a href="about.html" class="block px-3 py-3 text-base font-medium text-gray-200 hover:text-white hover:bg-slate-700 rounded-md">關於我們</a>
            <a href="knowledge.html" class="block px-3 py-3 text-base font-medium text-gray-200 hover:text-white hover:bg-slate-700 rounded-md">護教知識庫</a>
            <a href="media.html" class="block px-3 py-3 text-base font-bold text-veritas-gold bg-slate-700 rounded-md">影音策展</a>
            <a href="qa.html" class="block px-3 py-3 text-base font-medium text-gray-200 hover:text-white hover:bg-slate-700 rounded-md">真理問答箱</a>
            <a href="support.html" class="block px-3 py-3 text-base font-bold text-white bg-veritas-red hover:bg-veritas-darkred rounded-md"><i class="fa-solid fa-heart mr-2"></i>支持我們</a>
        </div>
    </div>

    <!-- 頁首 Hero 區塊 -->
    <header class="hero-gradient relative text-white py-20">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
            <h2 class="text-3xl md:text-5xl font-black mb-4">Veritas 影音策展</h2>
            <p class="text-gray-300 mb-10 max-w-2xl mx-auto text-lg">透過影像與聲音，讓真理的傳遞更有溫度。我們收錄了所有官方發布的講座精華、直播回放與 Podcast 廣播節目。</p>
            
            <!-- 影音專屬大按鈕切換區 -->
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button id="btn-youtube" onclick="switchMediaType('youtube')" class="media-tab flex-1 max-w-[200px] mx-auto sm:mx-0 bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-3 transform scale-105 border-2 border-red-400">
                    <i class="fa-brands fa-youtube text-2xl"></i> YouTube 頻道
                </button>
                <button id="btn-podcast" onclick="switchMediaType('podcast')" class="media-tab flex-1 max-w-[200px] mx-auto sm:mx-0 bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold py-4 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-3 border border-slate-700">
                    <i class="fa-solid fa-podcast text-2xl"></i> Podcast 廣播
                </button>
            </div>
            
            <div class="mt-8 flex justify-center gap-4 text-sm text-gray-400">
                <a href="https://www.youtube.com/@veritas3098/videos" target="_blank" class="hover:text-white transition flex items-center gap-1"><i class="fa-solid fa-external-link-alt"></i> 前往 YouTube</a>
                <a href="https://podcasts.apple.com/tw/podcast/%E5%A4%A9%E4%B8%BB%E6%95%99veritas%E8%AD%B7%E6%95%99%E4%B8%AD%E5%BF%83/id1542142187" target="_blank" class="hover:text-white transition flex items-center gap-1"><i class="fa-solid fa-external-link-alt"></i> 前往 Apple Podcast</a>
            </div>
        </div>
    </header>

    <!-- 影音內容展示區塊 -->
    <section class="py-12 bg-slate-900 min-h-screen">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
                <h3 id="section-title" class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fa-brands fa-youtube text-red-500"></i> 最新影片
                </h3>
                <span id="video-count" class="text-slate-400 text-sm">載入中...</span>
            </div>

            <!-- 瀑布流卡片區塊 -->
            <div id="media-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 transition-opacity duration-300">
                <!-- 載入中狀態 -->
                <div class="col-span-full text-center py-20 text-slate-400">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 text-veritas-gold"></i>
                    <p class="font-medium">正在連線至影音資料庫...</p>
                </div>
            </div>
            
            <!-- 分頁按鈕容器 -->
            <div id="pagination-container" class="mt-16 flex justify-center items-center gap-2 flex-wrap"></div>
            
        </div>
    </section>

    <!-- 頁尾 Footer (深色版) -->
    <footer class="bg-black text-gray-400 py-12 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="flex items-center gap-3">
                    <img src="images/logo.png" alt="Veritas Logo" class="w-8 h-8 opacity-80">
                    <span class="font-bold text-white text-xl">Veritas 護教中心</span>
                </div>
                <div class="text-sm text-center md:text-right">
                    <p>&copy; 2026 天主教 Veritas 護教中心. 捍衛真理，用愛傳遞天主信仰。</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- GAS API 前端串接腳本 -->
    <script>
        // 手機版選單
        document.getElementById('mobile-menu-btn').addEventListener('click', function() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        // 1. API 設定
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz6Iqnjt8r9poHA_l450uly_XkdX6d2iU7Qcc56fBObFbMoFrtXlSvFtznBUiRgO-lN/exec"; 
        
        let allMediaData = [];     // 儲存從 API 抓回來的所有「影音類」資料
        let currentDisplayData = []; // 目前畫面上顯示的資料 (YT 或 Podcast)
        let currentMode = 'youtube'; // 預設顯示 YouTube
        
        let currentPage = 1;
        const itemsPerPage = 9;

        document.addEventListener('DOMContentLoaded', () => {
            fetchMediaData();
        });

        // 2. 抓取並過濾資料
        async function fetchMediaData() {
            try {
                const response = await fetch(`${GAS_API_URL}?action=getKnowledgeData`);
                if (!response.ok) throw new Error('API 網路連線錯誤');
                const rawData = await response.json();

                if (rawData.error) throw new Error(rawData.error);

                // 只保留 youtube 和 podcast，並依日期排序
                allMediaData = rawData
                    .filter(item => item.category === 'youtube' || item.category === 'podcast')
                    .sort((a, b) => {
                        const dateA = a.date.replace(/年|月/g, '/').replace(/日/g, '');
                        const dateB = b.date.replace(/年|月/g, '/').replace(/日/g, '');
                        return new Date(dateB) - new Date(dateA);
                    });
                
                // 預設切換到 YouTube
                switchMediaType('youtube');

            } catch (error) {
                console.error("讀取影音資料失敗:", error);
                document.getElementById('media-grid').innerHTML = `
                    <div class="col-span-full text-center py-20 text-red-400 bg-red-900/20 rounded-2xl border border-red-800/50">
                        <i class="fa-solid fa-plug-circle-xmark text-4xl mb-4"></i>
                        <p class="font-bold text-lg">無法連線至影音資料庫。</p>
                        <p class="text-sm mt-2 opacity-70">${error.message}</p>
                    </div>
                `;
            }
        }

        // 3. 切換影音類型 (YouTube / Podcast)
        function switchMediaType(type) {
            currentMode = type;
            currentPage = 1; // 重置頁碼

            // 更新按鈕樣式
            const btnYt = document.getElementById('btn-youtube');
            const btnPod = document.getElementById('btn-podcast');
            const titleEl = document.getElementById('section-title');

            if (type === 'youtube') {
                btnYt.className = "media-tab flex-1 max-w-[200px] mx-auto sm:mx-0 bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-3 transform scale-105 border-2 border-red-400 z-10";
                btnPod.className = "media-tab flex-1 max-w-[200px] mx-auto sm:mx-0 bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold py-4 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-3 border border-slate-700";
                titleEl.innerHTML = '<i class="fa-brands fa-youtube text-red-500"></i> 最新 YouTube 影片';
            } else {
                btnPod.className = "media-tab flex-1 max-w-[200px] mx-auto sm:mx-0 bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-3 transform scale-105 border-2 border-purple-400 z-10";
                btnYt.className = "media-tab flex-1 max-w-[200px] mx-auto sm:mx-0 bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold py-4 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-3 border border-slate-700";
                titleEl.innerHTML = '<i class="fa-solid fa-podcast text-purple-400"></i> 最新 Podcast 單集';
            }

            // 過濾資料並渲染
            currentDisplayData = allMediaData.filter(item => item.category === type);
            document.getElementById('video-count').textContent = `共 ${currentDisplayData.length} 筆`;
            
            updateDisplay();
        }

        // 4. 更新畫面 (卡片+分頁)
        function updateDisplay() {
            renderCards(currentDisplayData);
            renderPagination(currentDisplayData.length);
        }

        // 5. 渲染卡片 (深色劇院風格)
        function renderCards(data) {
            const grid = document.getElementById('media-grid');
            grid.style.opacity = 0; 

            setTimeout(() => {
                grid.innerHTML = '';
                
                const startIndex = (currentPage - 1) * itemsPerPage;
                const endIndex = startIndex + itemsPerPage;
                const pageData = data.slice(startIndex, endIndex);

                if (pageData.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-500">此頻道目前沒有資料。</div>`;
                    grid.style.opacity = 1;
                    return;
                }

                pageData.forEach(item => {
                    const card = document.createElement('article');
                    card.className = "bg-slate-800 rounded-2xl overflow-hidden hover-card border border-slate-700 flex flex-col h-full shadow-lg";
                    
                    if (item.category === 'youtube') {
                        let isLive = item.title.includes('直播') || item.title.includes('Live');
                        card.innerHTML = `
                            <a href="${item.link}" target="_blank" class="relative h-48 bg-black flex items-center justify-center overflow-hidden group cursor-pointer block">
                                <img src="${item.thumbnail}" alt="${item.title}" class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-40 transition duration-500 group-hover:scale-105">
                                <div class="absolute inset-0 flex items-center justify-center">
                                    <div class="w-16 h-16 bg-red-600/90 rounded-full flex items-center justify-center text-white transform group-hover:scale-110 transition shadow-lg backdrop-blur-sm">
                                        <i class="fa-solid fa-play text-xl ml-1"></i>
                                    </div>
                                </div>
                                ${isLive ? `<div class="absolute top-3 left-3 bg-red-600/90 text-white text-[10px] font-bold px-2 py-1 rounded flex items-center gap-1 backdrop-blur-sm"><span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span> 直播回放</div>` : ''}
                                <div class="absolute bottom-2 right-2 bg-black/80 text-white text-xs px-2 py-1 rounded font-medium">${item.authorOrTime || '--:--'}</div>
                            </a>
                            <div class="p-6 flex flex-col flex-grow">
                                <h3 class="text-lg font-bold mb-3 line-clamp-2 text-white hover:text-red-400 transition"><a href="${item.link}" target="_blank">${item.title}</a></h3>
                                <p class="text-slate-400 text-sm mb-4 line-clamp-2 flex-grow">${item.desc}</p>
                                <div class="text-xs text-slate-500 flex justify-between items-center mt-auto pt-4 border-t border-slate-700">
                                    <span><i class="fa-regular fa-calendar mr-1"></i> ${item.date}</span>
                                </div>
                            </div>
                        `;
                    } else {
                        // Podcast
                        card.innerHTML = `
                            <a href="${item.link}" target="_blank" class="relative h-48 bg-slate-900 flex items-center justify-center overflow-hidden cursor-pointer group block">
                                <div class="absolute inset-0 bg-gradient-to-br from-purple-900/50 to-slate-900 group-hover:opacity-80 transition"></div>
                                <div class="w-20 h-20 border-4 border-purple-500/30 rounded-full flex items-center justify-center group-hover:border-purple-500 transition duration-500">
                                    <i class="fa-solid fa-podcast text-4xl text-purple-400 group-hover:scale-110 transition"></i>
                                </div>
                                <div class="absolute top-3 left-3 bg-purple-900/80 text-purple-200 text-[10px] font-bold px-2 py-1 rounded border border-purple-700 backdrop-blur-sm">${item.authorOrTime || '最新單集'}</div>
                            </a>
                            <div class="p-6 flex flex-col flex-grow">
                                <h3 class="text-lg font-bold mb-3 line-clamp-2 text-white hover:text-purple-400 transition"><a href="${item.link}" target="_blank">${item.title}</a></h3>
                                <p class="text-slate-400 text-sm mb-4 line-clamp-2 flex-grow">${item.desc}</p>
                                <div class="text-xs text-slate-500 flex justify-between items-center mt-auto pt-4 border-t border-slate-700">
                                    <span><i class="fa-regular fa-calendar mr-1"></i> ${item.date}</span>
                                </div>
                            </div>
                        `;
                    }
                    grid.appendChild(card);
                });
                grid.style.opacity = 1;
            }, 300);
        }

        // 6. 渲染分頁
        function renderPagination(totalItems) {
            const container = document.getElementById('pagination-container');
            container.innerHTML = ''; 
            
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (totalPages <= 1) return;

            // 深色主題的分頁按鈕樣式
            const baseClass = "w-10 h-10 rounded-lg font-bold transition flex items-center justify-center ";
            
            const prevBtn = document.createElement('button');
            prevBtn.innerHTML = '<i class="fa-solid fa-angle-left"></i>';
            prevBtn.className = baseClass + (currentPage === 1 ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700');
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => {
                if (currentPage > 1) { currentPage--; updateDisplay(); window.scrollTo({top: 400, behavior: 'smooth'}); }
            };
            container.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.textContent = i;
                
                // 根據當前模式決定啟用的顏色 (YT為紅，Podcast為紫)
                let activeColor = currentMode === 'youtube' ? 'bg-red-600 text-white' : 'bg-purple-600 text-white';
                
                pageBtn.className = baseClass + (currentPage === i ? activeColor : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700');
                pageBtn.onclick = () => {
                    currentPage = i; updateDisplay(); window.scrollTo({top: 400, behavior: 'smooth'});
                };
                container.appendChild(pageBtn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.innerHTML = '<i class="fa-solid fa-angle-right"></i>';
            nextBtn.className = baseClass + (currentPage === totalPages ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700');
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => {
                if (currentPage < totalPages) { currentPage++; updateDisplay(); window.scrollTo({top: 400, behavior: 'smooth'}); }
            };
            container.appendChild(nextBtn);
        }
    </script>
</body>
</html>
